name: Household dashboard
on:
  push:
    branches: [main, feat/household-dashboard]
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements*.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: pip install -r worker/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=worker python -m pytest -q worker/tests
      - run: python scripts/screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-4k-layouts
          path: docs/screenshots/*.jpg
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && cp config.example.json config.json
      - run: docker compose config --quiet
      - run: docker compose up --build --wait dashboard
      - run: |
          docker compose exec -T dashboard node -e "fetch('http://127.0.0.1:4321/api/week').then(async r=>{const p=await r.json();if(!r.ok||!p.days.length)process.exit(1)})"
          docker compose restart dashboard
          docker compose up --wait dashboard
      - run: docker compose --profile art build art
      - run: docker compose --profile art run --rm art render --at 2026-11-25T10:00:00Z --output /state/day.jpg
      - if: always()
        run: docker compose logs --no-color && docker compose --profile art down --volumes
